name: Bug report
description: Something in Arcosian does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. claude plugin install arcosian@arcosian
        2. /arcosian:new-game ...
        3. ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Claude Code version (claude --version), Arcosian plugin versions, engine and version.
      placeholder: Claude Code 2.1.306, arcosian 0.4.0, Godot 4.7.2
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux, other]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: Paste the relevant output. Remove keys, tokens and personal data first.
      render: shell
