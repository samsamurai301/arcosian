name: Feature request
description: Propose a skill, tool, template or workflow improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Arcosian do? Commands, files or skills involved.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [skills and knowledge, gs.py and tools, templates, adapters and connectors, hooks and safety, docs, other]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
