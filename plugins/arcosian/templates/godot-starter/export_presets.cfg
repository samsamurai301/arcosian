; Export presets for Android, iOS, Windows, macOS, Linux and Web. No secrets here: signing values are
; supplied at export time. Desktop builds are unsigned (macOS: ad-hoc); see the pc-web-release skill.
; Web uses the no-threads variant, so it runs on any static host without COOP/COEP headers.
; Android release signing via environment variables (read by the Godot exporter):
;   GODOT_ANDROID_KEYSTORE_RELEASE_PATH, GODOT_ANDROID_KEYSTORE_RELEASE_USER,
;   GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD (and the _DEBUG_ equivalents).
; Requires the Android build template (Project > Install Android Build Template) because gradle build is on.
; Play requires target SDK 36 for new apps/updates from Aug 2026 (verify); min SDK 24 is the Godot 4 floor.

[preset.0]

name="Android"
platform="Android"
runnable=true
dedicated_server=false
advanced_options=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="addons/*/*.md,tests/*,tools/*,docs/*"
export_path="build/android/game.aab"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

gradle_build/use_gradle_build=true
gradle_build/export_format=1
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86_64=false
keystore/debug=""
keystore/debug_user=""
keystore/debug_password=""
keystore/release=""
keystore/release_user=""
keystore/release_password=""
version/code=1
version/name="0.1.0"
package/unique_name="com.example.mergefive"
package/name="Merge Five"
package/signed=true
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true

